    Redirect target for MSAL's hidden silent-renewal iframe. It must stay empty.

    iframe, which then loaded the whole SPA inside it, re-ran bootstrap, and issued its own
    silent request. MSAL aborts that with block_iframe_reload, so every renewal failed once the
    24-hour refresh token lapsed and the app redirected to sign-in forever.
