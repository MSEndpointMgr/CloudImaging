version: 2
updates:
  # .NET solution (Directory.Packages.props at repo root; central package management)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # Portal backend (Express)
  - package-ecosystem: "npm"
    directory: "/src/cloud-imaging-portal/server"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # Portal frontend (React)
  - package-ecosystem: "npm"
    directory: "/src/cloud-imaging-portal/client"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # GitHub Actions used across workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
