name: GitHub Release - Cloud Imaging Client Package & Publish

# Triggered on Client version tags (e.g. mse-ci-client-v1.2.0).
# Builds the CloudImaging.Client WinPE binary and creates a GitHub Release. This
# is the asset Media Builder's "Automatic download" source option pulls, via the
# 'mse-ci-client-latest' alias release (see GitHubReleasesClient.cs).

on:
  push:
    tags:
      - 'mse-ci-client-v[0-9]+.[0-9]+.[0-9]+'
      # Pre-release tags (e.g. mse-ci-client-v1.2.0-beta.1); see release-iac.yml for why the
      # stable pattern alone never matches them.
      - 'mse-ci-client-v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version or tag to package (e.g. 1.0.0, v1.0.0 or mse-ci-client-v1.0.0). Defaults to the latest matching tag if blank. Created automatically at the current commit if it does not exist yet.'
        required: false

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-package:
    name: Build & Package Client Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Runs before the build so a manual run packages the tag's code, not the branch's.
      - name: Determine version tag
        id: tag
        env:
          # Read through the environment rather than interpolating `${{ }}` straight into the
          # script body: a ref or input containing quotes would otherwise be executed as
          # PowerShell.
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # On a workflow_dispatch run the ref is the *branch*, so github.ref_name is 'main'. It is
          # only a tag when ref_type says so. Taking it unconditionally published a release named
          # after a branch.
          $prefix = 'mse-ci-client-'
          # The input is accepted as the full tag, as 'v1.0.0', or as a bare '1.0.0'. Requiring the
          # full tag is an easy way to burn a CI run on a typo, and the prefix is fixed per
          # workflow anyway, so there is nothing to disambiguate.
          $requested = "$env:INPUT_TAG".Trim()
          $tag = switch -Regex ($requested) {
            '^$'       { '' }
            "^$prefix" { $requested }
            '^v'       { "$prefix$requested" }
            default    { "${prefix}v$requested" }
          }
          if (-not $tag -and $env:REF_TYPE -eq 'tag') { $tag = $env:REF_NAME }
          if (-not $tag) { $tag = git describe --tags --abbrev=0 --match "${prefix}v[0-9]*" }
          if ($tag -notmatch '^mse-ci-client-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
            throw "Could not resolve a Client release tag (got '$tag'). Push a mse-ci-client-v#.#.# tag, or pass a version such as '1.0.0' in the tag_name input."
          }
          # Fully qualified: a stray branch-named tag would otherwise make a bare name ambiguous.
          git rev-parse -q --verify "refs/tags/$tag" > $null
          if ($LASTEXITCODE -ne 0) {
            # A tag-triggered run's tag always exists (it's what triggered the push event) -- this
            # branch is only reachable on a workflow_dispatch run, where it's fine to mint the tag
            # the caller asked for on the commit they dispatched from.
            if ($env:REF_TYPE -eq 'tag') {
              throw "Tag '$tag' does not exist even though this run was triggered by a tag push."
            }
            Write-Host "Tag '$tag' does not exist yet -- creating it at $env:GITHUB_SHA."
            git tag $tag $env:GITHUB_SHA
            git push origin $tag
          }
          # A pre-release tag has a '-suffix' after the numeric version (e.g. -beta.1); the
          # 'mse-ci-client-' prefix itself contains hyphens, so a naive contains('-') is always true.
          $stable = $tag -match '^mse-ci-client-v[0-9]+\.[0-9]+\.[0-9]+$'
          # Bare version for display (title already says "Client"; avoid repeating it via the tag).
          $version = $tag -replace '^mse-ci-client-', ''
          # The alias release must point at the tag's commit. github.sha is the *branch* head on a
          # manual run, which would make the alias serve code that was never in the tagged build.
          $sha = git rev-parse "refs/tags/$tag^{commit}"
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append
          "sha=$sha" | Out-File $env:GITHUB_OUTPUT -Append
          "stable=$($stable.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Release tag: $tag (stable: $stable)"

      # `Check out the resolved tag` below replaces the working tree with the tag's code, and
      # tags cut before this gate existed have no .github/scripts directory at all, so the gate
      # script has to be copied out of the working tree first. The gate is release tooling, not
      # shipped code: it should match the workflow file being run (which on a manual run comes
      # from the dispatched branch, not the tag), so running the staged copy is also the correct
      # behaviour for tags that do contain a version of the script.
      - name: Stage the dependency gate script
        run: Copy-Item .github/scripts/Assert-NoVulnerableDependencies.ps1 $env:RUNNER_TEMP

      # A manual run checks out a branch, so the working tree holds whatever that branch points at
      # rather than the tag being packaged. Without this the release would carry the tag's name and
      # the branch's code. Safe to interpolate: the tag was validated against a strict pattern above.
      - name: Check out the resolved tag
        if: github.ref_type != 'tag'
        run: git checkout --detach "refs/tags/${{ steps.tag.outputs.tag }}"

      # CloudImaging.Client.csproj has no <RuntimeIdentifiers>, so a plain solution restore
      # produces an assets file with no win-x64 target -- the later --no-restore publish
      # then fails with NETSDK1047. Restore the project itself with the RID instead.
      - name: Restore CloudImaging.Client (win-x64)
        run: dotnet restore src/CloudImaging.Client/CloudImaging.Client.csproj -r win-x64

      # Release gate: halt before the client is built or published if one of its
      # dependencies has a known High/Critical advisory. Runs after restore because
      # `dotnet list package` needs the resolved assets file.
      - name: Fail the release on vulnerable dependencies
        run: |
          & "$env:RUNNER_TEMP/Assert-NoVulnerableDependencies.ps1" -MinimumSeverity High `
            -Project 'src/CloudImaging.Client/CloudImaging.Client.csproj'

      - name: Build CloudImaging.Client (WPF, self-contained win-x64)
        run: |
          dotnet publish src/CloudImaging.Client/CloudImaging.Client.csproj `
            -c Release -r win-x64 --self-contained -o publish/Client --no-restore
          New-Item release-artifacts -ItemType Directory -Force | Out-Null
          Compress-Archive publish/Client/* release-artifacts/CloudImaging.Client.zip

      - name: Generate SHA-256 checksum manifest
        run: |
          $hash = (Get-FileHash release-artifacts/CloudImaging.Client.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  CloudImaging.Client.zip" | Out-File "release-artifacts/SHA256SUMS"
          Write-Host "Client zip SHA-256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name:  ${{ steps.tag.outputs.tag }}
          name:      "Cloud Imaging Client ${{ steps.tag.outputs.version }}"
          body:      |
            WinPE-runnable binary embedded into boot images by Media Builder, either via the
            "Automatic download" source option (always resolves the `mse-ci-client-latest` alias
            release) or by pointing Media Builder at a local extracted copy of this ZIP.

            ### Release artifacts
            | File | Description |
            |------|-------------|
            | `CloudImaging.Client.zip` | Self-contained win-x64 WPF client (net10.0-windows) |
            | `SHA256SUMS` | SHA-256 checksum for integrity verification |
          files: |
            release-artifacts/CloudImaging.Client.zip
            release-artifacts/SHA256SUMS
          draft: false
          prerelease: ${{ steps.tag.outputs.stable != 'true' }}

      # ── Move the 'mse-ci-client-latest' alias (stable releases only) ───────────
      # GitHubReleasesClient.cs resolves this fixed tag instead of GitHub's
      # repo-wide /releases/latest, which would be unsafe once the iac/mediabuilder
      # streams interleave with this one.
      #
      # The alias tag is moved with git rather than created on the fly by the Releases API:
      # GITHUB_TOKEN can publish a release for an existing tag, but minting the missing alias tag
      # as part of creating the release fails with "HTTP 403: Resource not accessible by
      # integration". See release-iac.yml, where the same step failed that way.
      - name: Move the 'mse-ci-client-latest' tag to this release's commit
        if: ${{ steps.tag.outputs.stable == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The alias release does not exist before the first stable release, and 'gh release
          # delete' exits non-zero when it is missing, which would fail the job *after* the real
          # release had already published. Treat "nothing to move" as success. The tag is kept
          # (no --cleanup-tag) and force-moved below instead.
          $ErrorActionPreference = 'Continue'
          gh release delete mse-ci-client-latest --yes 2>&1 | Write-Host
          $ErrorActionPreference = 'Stop'
          git tag -f mse-ci-client-latest "${{ steps.tag.outputs.sha }}"
          git push -f origin refs/tags/mse-ci-client-latest

      - name: Publish the 'mse-ci-client-latest' alias release
        if: ${{ steps.tag.outputs.stable == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: mse-ci-client-latest
          name:     "Cloud Imaging Client (latest: ${{ steps.tag.outputs.tag }})"
          body:     "Always points to the newest stable Client release. See ${{ steps.tag.outputs.tag }} for full release notes."
          files: |
            release-artifacts/CloudImaging.Client.zip
            release-artifacts/SHA256SUMS
          make_latest: false
          draft: false
          prerelease: false
