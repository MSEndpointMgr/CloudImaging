# Full-stack deployment to the shared Azure dev environment (FR-046, FR-047, T158).
#
# Runs the Bicep IaC deployment followed by sequential deployment of all five Azure-hosted
# components (Device Gateway API, Operator API, Imaging Core API, Portal backend, Portal
# frontend). Cloud Imaging Client and Media Builder are build-only and are never deployed.
#
# Triggered from the VS Code "Deploy: Full Stack" task via
# `gh workflow run deploy-dev.yml --field confirm=deploy`. Use only for initial setup or a
# full environment refresh — for iterative work prefer deploy-components.yml.
#
# Authentication uses OIDC-based Azure Workload Identity Federation (no long-lived secrets);
# all environment-specific values come from the GitHub `azure-dev` environment secrets.
# This workflow is for internal core-developer use only and is NOT included in community
# release bundles.

name: Deploy Full Stack (dev)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm a full-stack IaC + all-component deployment"
        required: true
        default: ''

concurrency:
  group: deploy-dev-full
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

jobs:
  # ── Confirmation gate ────────────────────────────────────────────────────────
  guard:
    name: Confirm deployment
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation input
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "::error::Refusing to run. Re-run with the confirm input set to 'deploy'."
            exit 1
          fi
          echo "Confirmation accepted — proceeding with full-stack deployment."

  # ── Infrastructure (Bicep) ───────────────────────────────────────────────────
  iac:
    name: Deploy IaC (Bicep)
    needs: guard
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep template
        run: |
          az deployment group create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --template-file src/deploy/bicep/main.bicep \
            --parameters src/deploy/parameters/dev.parameters.json

  # ── DeviceGatewayApi (Function App) ──────────────────────────────────────────
  device-gateway:
    name: Deploy DeviceGatewayApi
    needs: iac
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore tests/CloudImaging.DeviceGatewayApi.Tests/CloudImaging.DeviceGatewayApi.Tests.csproj
      - name: Build (Release, warnings as errors)
        run: dotnet build src/CloudImaging.DeviceGatewayApi/CloudImaging.DeviceGatewayApi.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/CloudImaging.DeviceGatewayApi.Tests/CloudImaging.DeviceGatewayApi.Tests.csproj -c Release --no-restore
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish
        run: dotnet publish src/CloudImaging.DeviceGatewayApi/CloudImaging.DeviceGatewayApi.csproj -c Release -o ./publish/DeviceGatewayApi --no-restore
      - name: Deploy
        run: |
          cd ./publish/DeviceGatewayApi && zip -r ../../deploy-gateway.zip .
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_DEVICE_GATEWAY }} \
            --src ../../deploy-gateway.zip

  # ── OperatorApi (Function App) ───────────────────────────────────────────────
  operator:
    name: Deploy OperatorApi
    needs: device-gateway
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore tests/CloudImaging.OperatorApi.Tests/CloudImaging.OperatorApi.Tests.csproj
      - name: Build (Release, warnings as errors)
        run: dotnet build src/CloudImaging.OperatorApi/CloudImaging.OperatorApi.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/CloudImaging.OperatorApi.Tests/CloudImaging.OperatorApi.Tests.csproj -c Release --no-restore
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish
        run: dotnet publish src/CloudImaging.OperatorApi/CloudImaging.OperatorApi.csproj -c Release -o ./publish/OperatorApi --no-restore
      - name: Deploy
        run: |
          cd ./publish/OperatorApi && zip -r ../../deploy-operator.zip .
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_OPERATOR }} \
            --src ../../deploy-operator.zip

  # ── ImagingCoreApi (Function App) ────────────────────────────────────────────
  imaging-core:
    name: Deploy ImagingCoreApi
    needs: operator
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore tests/CloudImaging.ImagingCoreApi.Tests/CloudImaging.ImagingCoreApi.Tests.csproj
      - name: Build (Release, warnings as errors)
        run: dotnet build src/CloudImaging.ImagingCoreApi/CloudImaging.ImagingCoreApi.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/CloudImaging.ImagingCoreApi.Tests/CloudImaging.ImagingCoreApi.Tests.csproj -c Release --no-restore
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish
        run: dotnet publish src/CloudImaging.ImagingCoreApi/CloudImaging.ImagingCoreApi.csproj -c Release -o ./publish/ImagingCoreApi --no-restore
      # ImagingCoreApi is private (publicNetworkAccess=Disabled, Private Link only — FR-020),
      # so its SCM/Kudu endpoint is unreachable from the public GitHub-hosted runner. Briefly
      # enable public access for the zip-deploy, then always restore the private posture below.
      - name: Enable public access for deploy (temporary)
        run: |
          az resource update \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_IMAGING_CORE }} \
            --resource-type Microsoft.Web/sites \
            --set properties.publicNetworkAccess=Enabled \
            --output none
          # Allow the SCM site a moment to pick up the new access setting.
          sleep 45
      - name: Deploy
        run: |
          cd ./publish/ImagingCoreApi && zip -r ../../deploy-core.zip .
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_IMAGING_CORE }} \
            --src ../../deploy-core.zip
      - name: Restore private access (always)
        if: always()
        run: |
          az resource update \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_IMAGING_CORE }} \
            --resource-type Microsoft.Web/sites \
            --set properties.publicNetworkAccess=Disabled \
            --output none

  # ── Portal backend (App Service) ─────────────────────────────────────────────
  portal-backend:
    name: Deploy PortalBackend
    needs: imaging-core
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        working-directory: src/cloud-imaging-portal/server
        run: npm ci
      - name: Test
        working-directory: src/cloud-imaging-portal/server
        run: npm run test:run
      - name: Build
        working-directory: src/cloud-imaging-portal/server
        run: npm run build
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        working-directory: src/cloud-imaging-portal/server
        run: |
          # Assemble a self-contained bundle: compiled dist + manifest + production
          # node_modules. Zipping dist alone omits package.json/node_modules, so the
          # Node worker cannot resolve its runtime deps and the site fails to start.
          rm -rf deploy-pkg
          mkdir -p deploy-pkg/dist
          cp -r dist/. deploy-pkg/dist/
          cp package.json package-lock.json deploy-pkg/
          cd deploy-pkg
          npm ci --omit=dev
          zip -r ../deploy-portal-backend.zip . > /dev/null
          az webapp deploy \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.APP_SERVICE_PORTAL_BACKEND }} \
            --src-path ../deploy-portal-backend.zip \
            --type zip

  # ── Portal frontend (Static Web App) ─────────────────────────────────────────
  portal-frontend:
    name: Deploy PortalFrontend
    needs: portal-backend
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        working-directory: src/cloud-imaging-portal/client
        run: npm ci
      - name: Test
        working-directory: src/cloud-imaging-portal/client
        run: npm run test:run
      - name: Build
        working-directory: src/cloud-imaging-portal/client
        run: npm run build
      - name: Deploy (Static Web Apps)
        working-directory: src/cloud-imaging-portal/client
        run: |
          npx @azure/static-web-apps-cli deploy ./dist \
            --deployment-token ${{ secrets.STATIC_WEB_APP_PORTAL_TOKEN }} \
            --env production
