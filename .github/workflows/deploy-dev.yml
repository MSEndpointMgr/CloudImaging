name: Deploy — Full Stack (Dev)

# Triggers:
#   push to main  → automatic deploy of all 5 Azure-hosted components whenever
#                   source changes land in the relevant directories.
#   workflow_dispatch → manual full-stack deploy (IaC + all components) for
#                       initial setup or forced environment refresh.
#
# Cloud Imaging Client and Cloud Imaging Media Builder are NOT deployed here.
# They are desktop/WinPE apps built as artifacts; they have no Azure deployment target.

on:
  push:
    branches: [main]
    paths:
      # Azure-hosted components only — excludes Client, MediaBuilder, specs, docs
      - 'src/CloudImaging.DeviceGatewayApi/**'
      - 'src/CloudImaging.OperatorApi/**'
      - 'src/CloudImaging.ImagingCoreApi/**'
      - 'src/CloudImaging.Contracts/**'
      - 'src/cloud-imaging-portal/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm full-stack deployment to dev'
        required: true

# INTERNAL DEVELOPER USE ONLY — excluded from community release bundles (FR-047)
# Requires OIDC Workload Identity Federation configured per T159.

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

jobs:
  # Guard is only needed for manual workflow_dispatch to prevent accidental full-stack deploys.
  # On push to main this job is skipped automatically (no confirm input exists).
  guard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Input must be 'deploy' to proceed." && exit 1
          fi

  # ── IaC deployment ─────────────────────────────────────────────────────────
  # Only runs on manual dispatch. Infrastructure is stable between code changes;
  # re-running Bicep on every push is unnecessary and slow.
  iac:
    name: Bicep IaC — Deploy infrastructure
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: guard
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep
        run: |
          echo "TODO: az deployment group create --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --template-file src/deploy/bicep/main.bicep --parameters @src/deploy/parameters/dev.parameters.json"
          echo "IaC deployment placeholder — implement when T021-T024 Bicep modules are complete"

  # ── Component deployments ────────────────────────────────────────────────────
  # Runs on both push-to-main and manual dispatch.
  # On push: deploys immediately without IaC (infrastructure already exists).
  # On manual: runs after IaC completes.
  deploy-functions:
    name: Deploy Function Apps
    runs-on: ubuntu-latest
    needs:
      - ${{ github.event_name == 'workflow_dispatch' && 'iac' || '' }}
    if: always() && (needs.iac.result == 'success' || github.event_name == 'push')
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish DeviceGatewayApi
        run: dotnet publish src/CloudImaging.DeviceGatewayApi/CloudImaging.DeviceGatewayApi.csproj -c Release -o ./publish/DeviceGatewayApi
      - name: Publish OperatorApi
        run: dotnet publish src/CloudImaging.OperatorApi/CloudImaging.OperatorApi.csproj -c Release -o ./publish/OperatorApi
      - name: Publish ImagingCoreApi
        run: dotnet publish src/CloudImaging.ImagingCoreApi/CloudImaging.ImagingCoreApi.csproj -c Release -o ./publish/ImagingCoreApi
      - name: Deploy DeviceGatewayApi
        run: |
          cd ./publish/DeviceGatewayApi && zip -r ../../deploy-gateway.zip .
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_DEVICE_GATEWAY }} \
            --src ../../deploy-gateway.zip
      - name: Deploy OperatorApi
        run: |
          cd ./publish/OperatorApi && zip -r ../../deploy-operator.zip .
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_OPERATOR }} \
            --src ../../deploy-operator.zip
      - name: Deploy ImagingCoreApi
        run: |
          cd ./publish/ImagingCoreApi && zip -r ../../deploy-core.zip .
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_IMAGING_CORE }} \
            --src ../../deploy-core.zip

  deploy-portal:
    name: Deploy Portal (backend + frontend)
    runs-on: ubuntu-latest
    needs:
      - ${{ github.event_name == 'workflow_dispatch' && 'iac' || '' }}
    if: always() && (needs.iac.result == 'success' || github.event_name == 'push')
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build + deploy portal backend
        working-directory: src/cloud-imaging-portal/server
        run: |
          npm ci && npm run build
          cd dist && zip -r ../../../deploy-portal-backend.zip .
          az webapp deploy \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.APP_SERVICE_PORTAL_BACKEND }} \
            --src-path ../../../deploy-portal-backend.zip \
            --type zip
      - name: Build + deploy portal frontend (Static Web Apps)
        working-directory: src/cloud-imaging-portal/client
        run: |
          npm ci && npm run build
          npx @azure/static-web-apps-cli deploy ./dist \
            --deployment-token ${{ secrets.STATIC_WEB_APP_PORTAL_TOKEN }} \
            --env production
