name: Deploy — Component (Dev)

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to deploy'
        required: true
        type: choice
        options:
          - DeviceGatewayApi
          - OperatorApi
          - ImagingCoreApi
          - PortalBackend
          - PortalFrontend

# INTERNAL DEVELOPER USE ONLY — excluded from community release bundles (FR-047)

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.component }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # .NET components
      - if: ${{ github.event.inputs.component != 'PortalFrontend' && github.event.inputs.component != 'PortalBackend' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Deploy DeviceGatewayApi
        if: ${{ github.event.inputs.component == 'DeviceGatewayApi' }}
        run: |
          dotnet publish src/CloudImaging.DeviceGatewayApi/CloudImaging.DeviceGatewayApi.csproj -c Release -o ./publish
          cd ./publish && zip -r ../deploy.zip .
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_DEVICE_GATEWAY }} \
            --src ../deploy.zip

      - name: Deploy OperatorApi
        if: ${{ github.event.inputs.component == 'OperatorApi' }}
        run: |
          dotnet publish src/CloudImaging.OperatorApi/CloudImaging.OperatorApi.csproj -c Release -o ./publish
          cd ./publish && zip -r ../deploy.zip .
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_OPERATOR }} \
            --src ../deploy.zip

      - name: Deploy ImagingCoreApi
        if: ${{ github.event.inputs.component == 'ImagingCoreApi' }}
        run: |
          dotnet publish src/CloudImaging.ImagingCoreApi/CloudImaging.ImagingCoreApi.csproj -c Release -o ./publish
          cd ./publish && zip -r ../deploy.zip .
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_IMAGING_CORE }} \
            --src ../deploy.zip

      # Node.js components
      - if: ${{ github.event.inputs.component == 'PortalBackend' || github.event.inputs.component == 'PortalFrontend' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy PortalBackend
        if: ${{ github.event.inputs.component == 'PortalBackend' }}
        working-directory: src/cloud-imaging-portal/server
        run: |
          npm ci && npm run build
          cd dist && zip -r ../../../deploy.zip .
          az webapp deploy \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.APP_SERVICE_PORTAL_BACKEND }} \
            --src-path ../../../deploy.zip \
            --type zip

      - name: Deploy PortalFrontend
        if: ${{ github.event.inputs.component == 'PortalFrontend' }}
        working-directory: src/cloud-imaging-portal/client
        run: |
          npm ci && npm run build
          npx @azure/static-web-apps-cli deploy ./dist \
            --deployment-token ${{ secrets.STATIC_WEB_APP_PORTAL_TOKEN }} \
            --env production
