# Deploy a single component to the shared Azure dev environment (FR-046, FR-047, T158).
#
# On-demand, per-component deployment triggered from the VS Code "Deploy: <component>"
# tasks (.vscode/tasks.json) via `gh workflow run deploy-components.yml --field component=<name>`.
# Only the selected component is built, tested and deployed. Authentication uses OIDC-based
# Azure Workload Identity Federation (no long-lived secrets). All environment-specific values
# are read from the GitHub `azure-dev` environment secrets.
#
# This workflow is for internal core-developer use only and is NOT included in community
# release bundles.

name: Deploy Components (Azure)

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to deploy to the shared dev environment'
        required: true
        type: choice
        options:
          - DeviceGatewayApi
          - OperatorApi
          - ImagingCoreApi
          - PortalBackend
          - PortalFrontend

concurrency:
  group: deploy-component-${{ github.event.inputs.component }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

jobs:
  # ── DeviceGatewayApi (Function App) ──────────────────────────────────────────
  device-gateway:
    name: Deploy DeviceGatewayApi
    if: ${{ inputs.component == 'DeviceGatewayApi' }}
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore tests/CloudImaging.DeviceGatewayApi.Tests/CloudImaging.DeviceGatewayApi.Tests.csproj
      - name: Build (Release, warnings as errors)
        run: dotnet build src/CloudImaging.DeviceGatewayApi/CloudImaging.DeviceGatewayApi.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/CloudImaging.DeviceGatewayApi.Tests/CloudImaging.DeviceGatewayApi.Tests.csproj -c Release --no-restore
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish
        run: dotnet publish src/CloudImaging.DeviceGatewayApi/CloudImaging.DeviceGatewayApi.csproj -c Release -o ./publish/DeviceGatewayApi --no-restore
      - name: Deploy
        run: |
          cd ./publish/DeviceGatewayApi && zip -r ../../deploy-gateway.zip .
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_DEVICE_GATEWAY }} \
            --src ../../deploy-gateway.zip

  # ── OperatorApi (Function App) ───────────────────────────────────────────────
  operator:
    name: Deploy OperatorApi
    if: ${{ inputs.component == 'OperatorApi' }}
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore tests/CloudImaging.OperatorApi.Tests/CloudImaging.OperatorApi.Tests.csproj
      - name: Build (Release, warnings as errors)
        run: dotnet build src/CloudImaging.OperatorApi/CloudImaging.OperatorApi.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/CloudImaging.OperatorApi.Tests/CloudImaging.OperatorApi.Tests.csproj -c Release --no-restore
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish
        run: dotnet publish src/CloudImaging.OperatorApi/CloudImaging.OperatorApi.csproj -c Release -o ./publish/OperatorApi --no-restore
      - name: Deploy
        run: |
          cd ./publish/OperatorApi && zip -r ../../deploy-operator.zip .
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_OPERATOR }} \
            --src ../../deploy-operator.zip

  # ── ImagingCoreApi (Function App) ────────────────────────────────────────────
  imaging-core:
    name: Deploy ImagingCoreApi
    if: ${{ inputs.component == 'ImagingCoreApi' }}
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore tests/CloudImaging.ImagingCoreApi.Tests/CloudImaging.ImagingCoreApi.Tests.csproj
      - name: Build (Release, warnings as errors)
        run: dotnet build src/CloudImaging.ImagingCoreApi/CloudImaging.ImagingCoreApi.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/CloudImaging.ImagingCoreApi.Tests/CloudImaging.ImagingCoreApi.Tests.csproj -c Release --no-restore
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish
        run: dotnet publish src/CloudImaging.ImagingCoreApi/CloudImaging.ImagingCoreApi.csproj -c Release -o ./publish/ImagingCoreApi --no-restore
      - name: Deploy
        run: |
          cd ./publish/ImagingCoreApi && zip -r ../../deploy-core.zip .
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_IMAGING_CORE }} \
            --src ../../deploy-core.zip

  # ── Portal backend (App Service) ─────────────────────────────────────────────
  portal-backend:
    name: Deploy PortalBackend
    if: ${{ inputs.component == 'PortalBackend' }}
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        working-directory: src/cloud-imaging-portal/server
        run: npm ci
      - name: Test
        working-directory: src/cloud-imaging-portal/server
        run: npm run test:run
      - name: Build
        working-directory: src/cloud-imaging-portal/server
        run: npm run build
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        working-directory: src/cloud-imaging-portal/server
        run: |
          # Assemble a self-contained bundle: compiled dist + manifest + production
          # node_modules. Zipping dist alone omits package.json/node_modules, so the
          # Node worker cannot resolve its runtime deps and the site fails to start.
          # The zip is extracted to the persistent /home/site/wwwroot Azure Files share,
          # so the files survive platform cold restarts. Do NOT set WEBSITE_RUN_FROM_PACKAGE=1
          # on Linux App Service: that value is Windows-only and leaves wwwroot empty after a
          # restart, crash-looping the worker with MODULE_NOT_FOUND on dist/index.js.
          rm -rf deploy-pkg
          mkdir -p deploy-pkg/dist
          cp -r dist/. deploy-pkg/dist/
          cp package.json package-lock.json deploy-pkg/
          cd deploy-pkg
          npm ci --omit=dev
          zip -r ../deploy-portal-backend.zip . > /dev/null
          # --track-status false: skip az CLI's built-in warm-up probe. A cold start after
          # extraction can exceed its 10-min window and report a false failure even though the
          # site comes up. We verify readiness explicitly below.
          az webapp deploy \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.APP_SERVICE_PORTAL_BACKEND }} \
            --src-path ../deploy-portal-backend.zip \
            --type zip \
            --track-status false
      - name: Verify backend health
        run: |
          url="https://${{ secrets.APP_SERVICE_PORTAL_BACKEND }}.azurewebsites.net/api/health"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then echo "Portal backend is healthy."; exit 0; fi
            sleep 15
          done
          echo "::error::Portal backend did not return HTTP 200 within the timeout."
          exit 1

  # ── Portal frontend (Static Web App) ─────────────────────────────────────────
  portal-frontend:
    name: Deploy PortalFrontend
    if: ${{ inputs.component == 'PortalFrontend' }}
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        working-directory: src/cloud-imaging-portal/client
        run: npm ci
      - name: Test
        working-directory: src/cloud-imaging-portal/client
        run: npm run test:run
      - name: Build
        working-directory: src/cloud-imaging-portal/client
        run: npm run build
      - name: Deploy (Static Web Apps)
        working-directory: src/cloud-imaging-portal/client
        run: |
          npx @azure/static-web-apps-cli deploy ./dist \
            --deployment-token ${{ secrets.STATIC_WEB_APP_PORTAL_TOKEN }} \
            --env production
