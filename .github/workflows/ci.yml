name: CI / CD (Azure)

# The single build/test/deploy pipeline for the shared dev environment.
# Runs automatically when commits land on main, and on manual dispatch.
# There is one self-contained job per component: it builds, tests, lints and —
# for the Azure-hosted components — deploys to the dev environment.
#
# - On push: each job only runs when that component's own files, or the shared
#   code it depends on, changed in the push (path-based change detection).
# - On manual dispatch: pick a single component to redeploy, or "all" to run
#   every job (replaces the former deploy-components.yml / deploy-dev.yml).
#
# Infrastructure (Bicep) is deployed separately via the Azure Template Spec
# (see the "IaC: Publish Template Spec" task), not from this workflow.
# Client and MediaBuilder are build + test only — they are never deployed to Azure.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to build/deploy on this manual run'
        required: true
        type: choice
        default: all
        options:
          - all
          - DeviceGatewayApi
          - OperatorApi
          - ImagingCoreApi
          - PortalBackend
          - PortalFrontend
          - Client
          - MediaBuilder

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

jobs:
  # Detect which components changed so each component job only runs when its
  # own files — or the shared code it depends on — changed in the push.
  # Every .NET project references CloudImaging.Contracts, so a change to
  # Contracts (or root build/solution files) rebuilds all .NET components.
  # The portal (Node) is fully independent of the .NET code.
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      operator: ${{ steps.filter.outputs.operator }}
      core: ${{ steps.filter.outputs.core }}
      client: ${{ steps.filter.outputs.client }}
      media-builder: ${{ steps.filter.outputs.media-builder }}
      portal-backend: ${{ steps.filter.outputs.portal-backend }}
      portal-frontend: ${{ steps.filter.outputs.portal-frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'CloudImaging.sln'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'src/CloudImaging.Contracts/**'
            gateway:
              - *shared
              - 'src/CloudImaging.DeviceGatewayApi/**'
              - 'tests/CloudImaging.DeviceGatewayApi.Tests/**'
            operator:
              - *shared
              - 'src/CloudImaging.OperatorApi/**'
              - 'tests/CloudImaging.OperatorApi.Tests/**'
            core:
              - *shared
              - 'src/CloudImaging.ImagingCoreApi/**'
              - 'tests/CloudImaging.ImagingCoreApi.Tests/**'
            client:
              - *shared
              - 'src/CloudImaging.Client/**'
              - 'tests/CloudImaging.Client.Tests/**'
            media-builder:
              - *shared
              - 'src/CloudImaging.MediaBuilder/**'
              - 'src/CloudImaging.MediaBuilder.Installer/**'
              - 'tests/CloudImaging.MediaBuilder.Tests/**'
            portal-backend:
              - 'src/cloud-imaging-portal/server/**'
              - 'tests/cloud-imaging-portal/server/**'
            portal-frontend:
              - 'src/cloud-imaging-portal/client/**'
              - 'tests/cloud-imaging-portal/client/**'

  # Repo-wide security gate — always runs; every deploy-capable job depends on it.
  security-leakage-scan:
    name: Security log leakage scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run leakage scan
        run: |
          if [ -f "src/deploy/scripts/security-log-scan.ps1" ]; then
            echo "Security leakage scan script will run here (FR-012)"
          else
            echo "security-log-scan.ps1 not yet implemented — placeholder gate"
          fi

  # ── Component: DeviceGatewayApi (build + test + deploy) ──────────────────────
  device-gateway:
    name: DeviceGatewayApi (build + test + deploy)
    needs: [changes, security-leakage-scan]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.gateway == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'DeviceGatewayApi'))
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore tests/CloudImaging.DeviceGatewayApi.Tests/CloudImaging.DeviceGatewayApi.Tests.csproj
      - name: Build (Release, warnings as errors)
        run: dotnet build src/CloudImaging.DeviceGatewayApi/CloudImaging.DeviceGatewayApi.csproj -c Release --no-restore
      - name: Lint (dotnet format)
        run: dotnet format src/CloudImaging.DeviceGatewayApi/CloudImaging.DeviceGatewayApi.csproj --verify-no-changes
      - name: Test
        run: dotnet test tests/CloudImaging.DeviceGatewayApi.Tests/CloudImaging.DeviceGatewayApi.Tests.csproj -c Release --no-restore
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish
        run: dotnet publish src/CloudImaging.DeviceGatewayApi/CloudImaging.DeviceGatewayApi.csproj -c Release -o ./publish/DeviceGatewayApi --no-restore
      # The Function Apps are provisioned for run-from-package: the app reads a zip
      # from the app-packages storage container via its managed identity. A Kudu
      # config-zip push is rejected with HTTP 409 once WEBSITE_RUN_FROM_PACKAGE
      # points at a blob URL, so deploy by uploading the package and repointing it.
      - name: Deploy (run-from-package via blob)
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          STORAGE_ACCOUNT: ${{ secrets.STORAGE_ACCOUNT_APP }}
          FUNCTION_APP: ${{ secrets.FUNCTION_APP_DEVICE_GATEWAY }}
        run: |
          set -euo pipefail
          # Resolve the app package storage account. Prefer the STORAGE_ACCOUNT_APP secret
          # when set; otherwise discover the '*stapp' account in the resource group so the
          # deploy works without extra secrets.
          if [ -z "${STORAGE_ACCOUNT:-}" ]; then
            STORAGE_ACCOUNT=$(az storage account list --resource-group "$RESOURCE_GROUP" \
              --query "[?ends_with(name, 'stapp')].name | [0]" -o tsv)
          fi
          if [ -z "${STORAGE_ACCOUNT:-}" ]; then
            echo "::error::Could not resolve the app package storage account. Set the STORAGE_ACCOUNT_APP secret or ensure a '*stapp' account exists in $RESOURCE_GROUP."
            exit 1
          fi
          (cd ./publish/DeviceGatewayApi && zip -r ../../deploy-gateway.zip . > /dev/null)
          PKG="devicegatewayapi-${{ github.run_id }}-${{ github.run_attempt }}.zip"
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name app-packages \
            --name "$PKG" \
            --file deploy-gateway.zip \
            --auth-mode login \
            --overwrite true
          PKG_URL="https://${STORAGE_ACCOUNT}.blob.core.windows.net/app-packages/${PKG}"
          az functionapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --settings WEBSITE_RUN_FROM_PACKAGE="$PKG_URL" > /dev/null
          az functionapp restart --resource-group "$RESOURCE_GROUP" --name "$FUNCTION_APP"

  # ── Component: OperatorApi (build + test + deploy) ───────────────────────────
  operator:
    name: OperatorApi (build + test + deploy)
    needs: [changes, security-leakage-scan]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.operator == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'OperatorApi'))
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore tests/CloudImaging.OperatorApi.Tests/CloudImaging.OperatorApi.Tests.csproj
      - name: Build (Release, warnings as errors)
        run: dotnet build src/CloudImaging.OperatorApi/CloudImaging.OperatorApi.csproj -c Release --no-restore
      - name: Lint (dotnet format)
        run: dotnet format src/CloudImaging.OperatorApi/CloudImaging.OperatorApi.csproj --verify-no-changes
      - name: Test
        run: dotnet test tests/CloudImaging.OperatorApi.Tests/CloudImaging.OperatorApi.Tests.csproj -c Release --no-restore
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish
        run: dotnet publish src/CloudImaging.OperatorApi/CloudImaging.OperatorApi.csproj -c Release -o ./publish/OperatorApi --no-restore
      - name: Deploy (run-from-package via blob)
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          STORAGE_ACCOUNT: ${{ secrets.STORAGE_ACCOUNT_APP }}
          FUNCTION_APP: ${{ secrets.FUNCTION_APP_OPERATOR }}
        run: |
          set -euo pipefail
          # Resolve the app package storage account. Prefer the STORAGE_ACCOUNT_APP secret
          # when set; otherwise discover the '*stapp' account in the resource group so the
          # deploy works without extra secrets.
          if [ -z "${STORAGE_ACCOUNT:-}" ]; then
            STORAGE_ACCOUNT=$(az storage account list --resource-group "$RESOURCE_GROUP" \
              --query "[?ends_with(name, 'stapp')].name | [0]" -o tsv)
          fi
          if [ -z "${STORAGE_ACCOUNT:-}" ]; then
            echo "::error::Could not resolve the app package storage account. Set the STORAGE_ACCOUNT_APP secret or ensure a '*stapp' account exists in $RESOURCE_GROUP."
            exit 1
          fi
          (cd ./publish/OperatorApi && zip -r ../../deploy-operator.zip . > /dev/null)
          PKG="operatorapi-${{ github.run_id }}-${{ github.run_attempt }}.zip"
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name app-packages \
            --name "$PKG" \
            --file deploy-operator.zip \
            --auth-mode login \
            --overwrite true
          PKG_URL="https://${STORAGE_ACCOUNT}.blob.core.windows.net/app-packages/${PKG}"
          az functionapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --settings WEBSITE_RUN_FROM_PACKAGE="$PKG_URL" > /dev/null
          az functionapp restart --resource-group "$RESOURCE_GROUP" --name "$FUNCTION_APP"

  # ── Component: ImagingCoreApi (build + test + deploy) ────────────────────────
  imaging-core:
    name: ImagingCoreApi (build + test + deploy)
    needs: [changes, security-leakage-scan]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.core == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'ImagingCoreApi'))
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore tests/CloudImaging.ImagingCoreApi.Tests/CloudImaging.ImagingCoreApi.Tests.csproj
      - name: Build (Release, warnings as errors)
        run: dotnet build src/CloudImaging.ImagingCoreApi/CloudImaging.ImagingCoreApi.csproj -c Release --no-restore
      - name: Lint (dotnet format)
        run: dotnet format src/CloudImaging.ImagingCoreApi/CloudImaging.ImagingCoreApi.csproj --verify-no-changes
      - name: Test
        run: dotnet test tests/CloudImaging.ImagingCoreApi.Tests/CloudImaging.ImagingCoreApi.Tests.csproj -c Release --no-restore
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish
        run: dotnet publish src/CloudImaging.ImagingCoreApi/CloudImaging.ImagingCoreApi.csproj -c Release -o ./publish/ImagingCoreApi --no-restore
      # ImagingCoreApi is private (publicNetworkAccess=Disabled, Private Link only).
      # Blob upload + appsettings + restart all go through ARM / the storage data
      # plane, so no Kudu/SCM access is needed and the app is never exposed publicly.
      - name: Deploy (run-from-package via blob)
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          STORAGE_ACCOUNT: ${{ secrets.STORAGE_ACCOUNT_CORE }}
          FUNCTION_APP: ${{ secrets.FUNCTION_APP_IMAGING_CORE }}
        run: |
          set -euo pipefail
          # Resolve the Core package storage account. Prefer the STORAGE_ACCOUNT_CORE secret
          # when set; otherwise discover the '*stcore' account in the resource group so the
          # deploy works without extra secrets.
          if [ -z "${STORAGE_ACCOUNT:-}" ]; then
            STORAGE_ACCOUNT=$(az storage account list --resource-group "$RESOURCE_GROUP" \
              --query "[?ends_with(name, 'stcore')].name | [0]" -o tsv)
          fi
          if [ -z "${STORAGE_ACCOUNT:-}" ]; then
            echo "::error::Could not resolve the Core package storage account. Set the STORAGE_ACCOUNT_CORE secret or ensure a '*stcore' account exists in $RESOURCE_GROUP."
            exit 1
          fi
          (cd ./publish/ImagingCoreApi && zip -r ../../deploy-core.zip . > /dev/null)
          PKG="imagingcoreapi-${{ github.run_id }}-${{ github.run_attempt }}.zip"
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name app-packages \
            --name "$PKG" \
            --file deploy-core.zip \
            --auth-mode login \
            --overwrite true
          PKG_URL="https://${STORAGE_ACCOUNT}.blob.core.windows.net/app-packages/${PKG}"
          az functionapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP" \
            --settings WEBSITE_RUN_FROM_PACKAGE="$PKG_URL" > /dev/null
          az functionapp restart --resource-group "$RESOURCE_GROUP" --name "$FUNCTION_APP"

  # ── Component: Client (WPF, build + test only — never deployed) ──────────────
  client:
    name: Client (WPF, build + test)
    needs: [changes]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.client == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'Client'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore tests/CloudImaging.Client.Tests/CloudImaging.Client.Tests.csproj
      - name: Build (Release)
        run: dotnet build src/CloudImaging.Client/CloudImaging.Client.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/CloudImaging.Client.Tests/CloudImaging.Client.Tests.csproj -c Release --no-restore

  # ── Component: MediaBuilder (WPF, build + test only — never deployed) ────────
  media-builder:
    name: MediaBuilder (WPF, build + test)
    needs: [changes]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.media-builder == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'MediaBuilder'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore tests/CloudImaging.MediaBuilder.Tests/CloudImaging.MediaBuilder.Tests.csproj
      - name: Build (Release)
        run: dotnet build src/CloudImaging.MediaBuilder/CloudImaging.MediaBuilder.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/CloudImaging.MediaBuilder.Tests/CloudImaging.MediaBuilder.Tests.csproj -c Release --no-restore
      # The MSI is only produced for real by release-mediabuilder.yml, but the WiX authoring
      # references file names, the app icon and the HKLM configuration keys that App.xaml.cs reads.
      # Building it here means a rename or a moved asset fails on the PR rather than at release time.
      - name: Smoke-build installer (WiX MSI)
        run: |
          dotnet publish src/CloudImaging.MediaBuilder/CloudImaging.MediaBuilder.csproj `
            -c Release -r win-x64 --self-contained -o publish/MediaBuilder
          dotnet build src/CloudImaging.MediaBuilder.Installer/CloudImaging.MediaBuilder.Installer.wixproj -c Release

  # ── Component: Portal backend (build + lint + test + deploy) ─────────────────
  portal-backend:
    name: Portal backend (build + lint + test + deploy)
    needs: [changes, security-leakage-scan]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.portal-backend == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'PortalBackend'))
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        working-directory: src/cloud-imaging-portal/server
        run: npm ci
      - name: Lint
        working-directory: src/cloud-imaging-portal/server
        run: npm run lint
      - name: Test
        working-directory: src/cloud-imaging-portal/server
        run: npm run test:run
      - name: Build
        working-directory: src/cloud-imaging-portal/server
        run: npm run build
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        working-directory: src/cloud-imaging-portal/server
        run: |
          # Assemble a self-contained bundle: compiled dist + manifest + production
          # node_modules. Zipping dist alone omits package.json/node_modules, so the
          # Node worker cannot resolve its runtime deps and the site fails to start.
          # The zip is extracted to the persistent /home/site/wwwroot Azure Files share,
          # so the files survive platform cold restarts. Do NOT set WEBSITE_RUN_FROM_PACKAGE=1
          # on Linux App Service: that value is Windows-only and leaves wwwroot empty after a
          # restart, crash-looping the worker with MODULE_NOT_FOUND on dist/index.js.
          rm -rf deploy-pkg
          mkdir -p deploy-pkg/dist
          cp -r dist/. deploy-pkg/dist/
          cp package.json package-lock.json deploy-pkg/
          cd deploy-pkg
          npm ci --omit=dev
          zip -r ../deploy-portal-backend.zip . > /dev/null
          # --track-status false: skip az CLI's built-in warm-up probe. A cold start after
          # extraction can exceed its 10-min window and report a false failure even though the
          # site comes up. We verify readiness explicitly below.
          az webapp deploy \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.APP_SERVICE_PORTAL_BACKEND }} \
            --src-path ../deploy-portal-backend.zip \
            --type zip \
            --track-status false
      - name: Verify backend health
        run: |
          url="https://${{ secrets.APP_SERVICE_PORTAL_BACKEND }}.azurewebsites.net/api/health"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then echo "Portal backend is healthy."; exit 0; fi
            sleep 15
          done
          echo "::error::Portal backend did not return HTTP 200 within the timeout."
          exit 1

  # ── Component: Portal frontend (build + lint + test + deploy) ────────────────
  portal-frontend:
    name: Portal frontend (build + lint + test + deploy)
    needs: [changes, security-leakage-scan]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.portal-frontend == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'PortalFrontend'))
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        working-directory: src/cloud-imaging-portal/client
        run: npm ci
      - name: Lint
        working-directory: src/cloud-imaging-portal/client
        run: npm run lint
      - name: Test
        working-directory: src/cloud-imaging-portal/client
        run: npm run test:run
      - name: Build
        working-directory: src/cloud-imaging-portal/client
        run: npm run build
      - name: Deploy (Static Web Apps)
        working-directory: src/cloud-imaging-portal/client
        run: |
          npx @azure/static-web-apps-cli deploy ./dist \
            --deployment-token ${{ secrets.STATIC_WEB_APP_PORTAL_TOKEN }} \
            --env production

