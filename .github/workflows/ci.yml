name: CI / Deploy Dev

# Runs once when a PR is merged to main.
# CI gates run first. If all pass, the five Azure-hosted components are
# deployed automatically to the dev environment.
#
# Client and MediaBuilder are built for compile validation only —
# they are never deployed to Azure.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger (e.g. force redeploy)'
        required: false
        default: 'Manual trigger'

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

# ── CI GATES (always run — PR and push) ────────────────────────────────────────

jobs:
  dotnet-build:
    name: .NET Build (Release, zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore CloudImaging.sln -p:EnableWindowsTargeting=true
      - name: Build — Release, TreatWarningsAsErrors
        run: dotnet build CloudImaging.sln --configuration Release --no-restore -p:EnableWindowsTargeting=true

  dotnet-build-wpf:
    name: WPF Apps Build (Client + MediaBuilder, Windows only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore CloudImaging.sln
      - name: Build Client
        run: dotnet build src/CloudImaging.Client/CloudImaging.Client.csproj --configuration Release --no-restore
      - name: Build MediaBuilder
        run: dotnet build src/CloudImaging.MediaBuilder/CloudImaging.MediaBuilder.csproj --configuration Release --no-restore

  dotnet-test:
    name: .NET Unit Tests (>= 80% coverage)
    runs-on: ubuntu-latest
    needs: dotnet-build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore CloudImaging.sln -p:EnableWindowsTargeting=true
      - name: Test
        run: >
          dotnet test CloudImaging.sln
          --configuration Release
          --no-restore
          -p:EnableWindowsTargeting=true
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage
          path: ./TestResults

  dotnet-format:
    name: .NET Lint (dotnet format)
    runs-on: ubuntu-latest
    needs: dotnet-build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore CloudImaging.sln -p:EnableWindowsTargeting=true
      - name: Verify format
        run: dotnet format CloudImaging.sln --verify-no-changes -p:EnableWindowsTargeting=true

  portal-ci:
    name: Portal CI (build + lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install client deps
        working-directory: src/cloud-imaging-portal/client
        run: npm install
      - name: Install server deps
        working-directory: src/cloud-imaging-portal/server
        run: npm install
      - name: Lint client
        working-directory: src/cloud-imaging-portal/client
        run: npm run lint
      - name: Lint server
        working-directory: src/cloud-imaging-portal/server
        run: npm run lint
      - name: Test client
        working-directory: src/cloud-imaging-portal/client
        run: npm run test:run
      - name: Test server
        working-directory: src/cloud-imaging-portal/server
        run: npm run test:run
      - name: Build client
        working-directory: src/cloud-imaging-portal/client
        run: npm run build
      - name: Build server
        working-directory: src/cloud-imaging-portal/server
        run: npm run build

  security-leakage-scan:
    name: Security log leakage scan
    runs-on: ubuntu-latest
    needs: [dotnet-test, portal-ci]
    steps:
      - uses: actions/checkout@v7
      - name: Run leakage scan
        run: |
          if [ -f "src/deploy/scripts/security-log-scan.ps1" ]; then
            echo "Security leakage scan script will run here (FR-012)"
          else
            echo "security-log-scan.ps1 not yet implemented — placeholder gate"
          fi

# ── DEPLOY GATES (push to main only, after all CI gates pass) ──────────────────

  deploy-functions:
    name: Deploy API Function Apps to dev
    runs-on: ubuntu-latest
    needs: [dotnet-build, dotnet-test, dotnet-format, portal-ci, security-leakage-scan]
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish DeviceGatewayApi
        run: dotnet publish src/CloudImaging.DeviceGatewayApi/CloudImaging.DeviceGatewayApi.csproj -c Release -o ./publish/DeviceGatewayApi
      - name: Publish OperatorApi
        run: dotnet publish src/CloudImaging.OperatorApi/CloudImaging.OperatorApi.csproj -c Release -o ./publish/OperatorApi
      - name: Publish ImagingCoreApi
        run: dotnet publish src/CloudImaging.ImagingCoreApi/CloudImaging.ImagingCoreApi.csproj -c Release -o ./publish/ImagingCoreApi
      - name: Deploy DeviceGatewayApi
        run: |
          cd ./publish/DeviceGatewayApi && zip -r ../../deploy-gateway.zip .
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_DEVICE_GATEWAY }} \
            --src ../../deploy-gateway.zip
      - name: Deploy OperatorApi
        run: |
          cd ./publish/OperatorApi && zip -r ../../deploy-operator.zip .
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_OPERATOR }} \
            --src ../../deploy-operator.zip
      - name: Deploy ImagingCoreApi
        run: |
          cd ./publish/ImagingCoreApi && zip -r ../../deploy-core.zip .
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.FUNCTION_APP_IMAGING_CORE }} \
            --src ../../deploy-core.zip

  deploy-portal:
    name: Deploy Portal (backend + frontend) to dev
    runs-on: ubuntu-latest
    needs: [dotnet-build, dotnet-test, dotnet-format, portal-ci, security-leakage-scan]
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build + deploy portal backend
        working-directory: src/cloud-imaging-portal/server
        run: |
          npm ci && npm run build
          cd dist && zip -r ../../../deploy-portal-backend.zip .
          az webapp deploy \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.APP_SERVICE_PORTAL_BACKEND }} \
            --src-path ../../../deploy-portal-backend.zip \
            --type zip
      - name: Build + deploy portal frontend (Static Web Apps)
        working-directory: src/cloud-imaging-portal/client
        run: |
          npm ci && npm run build
          npx @azure/static-web-apps-cli deploy ./dist \
            --deployment-token ${{ secrets.STATIC_WEB_APP_PORTAL_TOKEN }} \
            --env production

