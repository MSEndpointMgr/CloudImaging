name: GitHub Release - Media Builder Package & Publish

# Triggered on Media Builder version tags (e.g. mse-ci-mediabuilder-v1.2.0).
# Builds the CloudImaging.MediaBuilder technician-workstation app and creates a
# GitHub Release. Installed via Win32/Intune packaging (see
# docs/setup-instructions.md "Packaging as a Win32 app") — nothing auto-downloads
# it, so this stream has no moving "latest" alias (unlike release-client.yml).

on:
  push:
    tags:
      - 'mse-ci-mediabuilder-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to package (e.g. mse-ci-mediabuilder-v1.0.0). Defaults to latest matching tag if blank.'
        required: false

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-package:
    name: Build & Package Media Builder Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # CloudImaging.MediaBuilder.csproj has no <RuntimeIdentifiers>, so a plain solution restore
      # produces an assets file with no win-x64 target -- the later --no-restore publish
      # then fails with NETSDK1047. Restore the project itself with the RID instead.
      - name: Restore CloudImaging.MediaBuilder (win-x64)
        run: dotnet restore src/CloudImaging.MediaBuilder/CloudImaging.MediaBuilder.csproj -r win-x64

      - name: Build CloudImaging.MediaBuilder (WPF, self-contained win-x64)
        run: |
          dotnet publish src/CloudImaging.MediaBuilder/CloudImaging.MediaBuilder.csproj `
            -c Release -r win-x64 --self-contained -o publish/MediaBuilder --no-restore
          New-Item release-artifacts -ItemType Directory -Force | Out-Null
          Compress-Archive publish/MediaBuilder/* release-artifacts/CloudImaging.MediaBuilder.zip

      - name: Determine version tag
        id: tag
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = git describe --tags --abbrev=0 --match 'mse-ci-mediabuilder-v*' }
          # A pre-release tag has a '-suffix' after the numeric version (e.g. -beta.1); the
          # 'mse-ci-mediabuilder-' prefix itself contains hyphens, so a naive contains('-') is always true.
          $stable = $tag -match '^mse-ci-mediabuilder-v[0-9]+\.[0-9]+\.[0-9]+$'
          # Bare version for display (title already says "Media Builder"; avoid repeating it via the tag).
          $version = $tag -replace '^mse-ci-mediabuilder-', ''
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append
          "stable=$($stable.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Release tag: $tag (stable: $stable)"

      - name: Generate SHA-256 checksum manifest
        run: |
          $hash = (Get-FileHash release-artifacts/CloudImaging.MediaBuilder.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  CloudImaging.MediaBuilder.zip" | Out-File "release-artifacts/SHA256SUMS"
          Write-Host "Media Builder zip SHA-256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:  ${{ steps.tag.outputs.tag }}
          name:      "Cloud Imaging Media Builder ${{ steps.tag.outputs.version }}"
          body:      |
            Technician-workstation WPF app used to generate WinPE boot images and prepare USB
            storage devices. Packages cleanly as a Win32 app (Intune, ConfigMgr, etc.) — see
            `docs/setup-instructions.md` → "Packaging as a Win32 app".

            ### Release artifacts
            | File | Description |
            |------|-------------|
            | `CloudImaging.MediaBuilder.zip` | Self-contained win-x64 WPF app (net10.0-windows) |
            | `SHA256SUMS` | SHA-256 checksum for integrity verification |
          files: |
            release-artifacts/CloudImaging.MediaBuilder.zip
            release-artifacts/SHA256SUMS
          draft: false
          prerelease: ${{ steps.tag.outputs.stable != 'true' }}
