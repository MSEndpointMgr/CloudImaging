name: GitHub Release - Media Builder Package & Publish

# Triggered on Media Builder version tags (e.g. mse-ci-mediabuilder-v1.2.0).
# Builds the CloudImaging.MediaBuilder technician-workstation app and creates a
# GitHub Release carrying both a plain self-contained zip and a per-machine MSI
# for Intune/ConfigMgr deployment (see docs/setup-instructions.md "Deploying the
# Media Builder with Intune"). Nothing auto-downloads either artifact, so this
# stream has no moving "latest" alias (unlike release-client.yml).

on:
  push:
    tags:
      - 'mse-ci-mediabuilder-v[0-9]+.[0-9]+.[0-9]+'
      # Pre-release tags (e.g. mse-ci-mediabuilder-v1.2.0-beta.1); see release-iac.yml for why the
      # stable pattern alone never matches them.
      - 'mse-ci-mediabuilder-v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version or tag to package (e.g. 1.0.0, v1.0.0 or mse-ci-mediabuilder-v1.0.0). Defaults to the latest matching tag if blank. Created automatically at the current commit if it does not exist yet.'
        required: false

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-package:
    name: Build & Package Media Builder Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Runs before the build because the MSI's ProductVersion is derived from the tag.
      - name: Determine version tag
        id: tag
        env:
          # Read through the environment rather than interpolating `${{ }}` straight into the
          # script body: a ref or input containing quotes would otherwise be executed as
          # PowerShell.
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # On a workflow_dispatch run the ref is the *branch*, so github.ref_name is 'main'. It is
          # only a tag when ref_type says so. Taking it unconditionally is what made a manual run
          # build "version main", which WiX rejects with WIX0108, and which would otherwise have
          # published a release named after a branch.
          $prefix = 'mse-ci-mediabuilder-'
          # The input is accepted as the full tag, as 'v1.0.0', or as a bare '1.0.0'. Requiring the
          # full tag is an easy way to burn a five-minute CI run on a typo, and the prefix is fixed
          # per workflow anyway, so there is nothing to disambiguate.
          $requested = "$env:INPUT_TAG".Trim()
          $tag = switch -Regex ($requested) {
            '^$'            { '' }
            "^$prefix"      { $requested }
            '^v'            { "$prefix$requested" }
            default         { "${prefix}v$requested" }
          }
          if (-not $tag -and $env:REF_TYPE -eq 'tag') { $tag = $env:REF_NAME }
          if (-not $tag) { $tag = git describe --tags --abbrev=0 --match "$prefix*" }
          if ($tag -notmatch '^mse-ci-mediabuilder-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
            throw "Could not resolve a Media Builder release tag (got '$tag'). Push a mse-ci-mediabuilder-v#.#.# tag, or pass a version such as '1.0.0' in the tag_name input."
          }
          # Fully qualified: a stray branch-named tag would otherwise make a bare name ambiguous.
          git rev-parse -q --verify "refs/tags/$tag" > $null
          if ($LASTEXITCODE -ne 0) {
            # A tag-triggered run's tag always exists (it's what triggered the push event) -- this
            # branch is only reachable on a workflow_dispatch run, where it's fine to mint the tag
            # the caller asked for on the commit they dispatched from.
            if ($env:REF_TYPE -eq 'tag') {
              throw "Tag '$tag' does not exist even though this run was triggered by a tag push."
            }
            Write-Host "Tag '$tag' does not exist yet -- creating it at $env:GITHUB_SHA."
            git tag $tag $env:GITHUB_SHA
            git push origin $tag
          }
          # A pre-release tag has a '-suffix' after the numeric version (e.g. -beta.1); the
          # 'mse-ci-mediabuilder-' prefix itself contains hyphens, so a naive contains('-') is always true.
          $stable = $tag -match '^mse-ci-mediabuilder-v[0-9]+\.[0-9]+\.[0-9]+$'
          # Bare version for display (title already says "Media Builder"; avoid repeating it via the tag).
          $version = $tag -replace '^mse-ci-mediabuilder-', ''
          # MSI ProductVersion must be a bare numeric major.minor.build: Windows Installer rejects a
          # leading 'v' and ignores anything after the third field, so a pre-release suffix is dropped
          # (which is why the MSI is built with AllowSameVersionUpgrades, see the .wixproj).
          $msiVersion = ($version -replace '^v', '') -replace '-.*$', ''
          "tag=$tag"                 | Out-File $env:GITHUB_OUTPUT -Append
          "stable=$($stable.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append
          "version=$version"         | Out-File $env:GITHUB_OUTPUT -Append
          "msi_version=$msiVersion"  | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Release tag: $tag (stable: $stable, MSI ProductVersion: $msiVersion)"

      # A manual run checks out a branch, so the working tree holds whatever that branch points at
      # rather than the tag being packaged. Without this the release would carry the tag's name and
      # the branch's code. Safe to interpolate: the tag was validated against a strict pattern above.
      - name: Check out the resolved tag
        if: github.ref_type != 'tag'
        run: git checkout --detach "refs/tags/${{ steps.tag.outputs.tag }}"

      # CloudImaging.MediaBuilder.csproj has no <RuntimeIdentifiers>, so a plain solution restore
      # produces an assets file with no win-x64 target -- the later --no-restore publish
      # then fails with NETSDK1047. Restore the project itself with the RID instead.
      - name: Restore CloudImaging.MediaBuilder (win-x64)
        run: dotnet restore src/CloudImaging.MediaBuilder/CloudImaging.MediaBuilder.csproj -r win-x64

      - name: Build CloudImaging.MediaBuilder (WPF, self-contained win-x64)
        run: |
          dotnet publish src/CloudImaging.MediaBuilder/CloudImaging.MediaBuilder.csproj `
            -c Release -r win-x64 --self-contained -o publish/MediaBuilder --no-restore
          New-Item release-artifacts -ItemType Directory -Force | Out-Null
          Compress-Archive publish/MediaBuilder/* release-artifacts/CloudImaging.MediaBuilder.zip

      # Harvests the same publish/MediaBuilder payload that was just zipped, so the MSI and the zip
      # in a given release are always byte-identical in content.
      - name: Build CloudImaging.MediaBuilder.msi (WiX)
        run: |
          dotnet build src/CloudImaging.MediaBuilder.Installer/CloudImaging.MediaBuilder.Installer.wixproj `
            -c Release -p:MsiProductVersion=${{ steps.tag.outputs.msi_version }}
          Copy-Item src/CloudImaging.MediaBuilder.Installer/bin/Release/CloudImaging.MediaBuilder.msi release-artifacts/

      - name: Generate SHA-256 checksum manifest
        run: |
          # Enumerate into a variable first: streaming Get-ChildItem straight into Out-File would
          # race the directory listing against the manifest file being created and could hash it.
          $artifacts = @(Get-ChildItem release-artifacts -File | Sort-Object Name)
          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLower()
            Write-Host "$($artifact.Name) SHA-256: $hash"
            "$hash  $($artifact.Name)"
          }
          $lines | Out-File "release-artifacts/SHA256SUMS"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name:  ${{ steps.tag.outputs.tag }}
          name:      "Cloud Imaging Media Builder ${{ steps.tag.outputs.version }}"
          body:      |
            Technician-workstation WPF app used to generate WinPE boot images and prepare USB
            storage devices.

            Deploy it with the MSI: it installs per-machine and takes the tenant configuration as
            install properties, so there is no need to repackage the payload per tenant. See
            `docs/setup-instructions.md` → "Deploying the Media Builder with Intune" for the full
            deployment guide, including MSI properties.

            ### Release artifacts
            | File | Description |
            |------|-------------|
            | `CloudImaging.MediaBuilder.msi` | Per-machine installer (x64). Configured via MSI properties; upgrades in place and keeps existing configuration. |
            | `CloudImaging.MediaBuilder.zip` | The same self-contained win-x64 payload (net10.0-windows), unpackaged, for xcopy deployment or custom packaging. |
            | `SHA256SUMS` | SHA-256 checksums for integrity verification |
          files: |
            release-artifacts/CloudImaging.MediaBuilder.msi
            release-artifacts/CloudImaging.MediaBuilder.zip
            release-artifacts/SHA256SUMS
          draft: false
          prerelease: ${{ steps.tag.outputs.stable != 'true' }}
